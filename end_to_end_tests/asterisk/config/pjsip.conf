[global]
type = global
user_agent = asterisk-e2e/20.11.1
default_realm = 127.0.0.1
endpoint_identifier_order = auth_username,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
allow_reload = no

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
allow_reload = no

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/server.crt
priv_key_file = /etc/asterisk/keys/server.key
ca_list_file = /etc/asterisk/keys/ca.crt
method = tlsv1_2
verify_client = no
verify_server = no
require_client_cert = no
allow_reload = no

# Compose mounts one of the two explicit media-mode files here.
#include pjsip-endpoints.conf
