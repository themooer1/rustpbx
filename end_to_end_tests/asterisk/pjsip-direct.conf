; Explicit direct-media endpoint configuration.
[1001]
type = endpoint
context = e2e
disallow = all
allow = alaw
auth = auth1001
aors = 1001
direct_media = yes
direct_media_method = invite
disable_direct_media_on_nat = no
dtmf_mode = rfc4733
rtp_symmetric = no
rewrite_contact = no
force_rport = no
timers = no

[auth1001]
type = auth
auth_type = userpass
username = 1001
password = e2e-password

[1001]
type = aor
max_contacts = 1
remove_existing = yes
default_expiration = 60
minimum_expiration = 1
maximum_expiration = 600

